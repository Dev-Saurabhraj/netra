version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netra_password}
      POSTGRES_DB: ${POSTGRES_DB:-netra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netra_user} -d ${POSTGRES_DB:-netra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netra-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netra_user}:${POSTGRES_PASSWORD:-netra_password}@postgres:5432/${POSTGRES_DB:-netra_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-netra_super_secret_jwt_key_change_in_production_for_security}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - default
      - netra_lab_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  netra_lab_net:
    external: true

